quarkus.http.port=8080
quarkus.http.host=0.0.0.0
# Um único perfil seleciona infraestrutura real em tempo de execução.
flashsale.real=false
%real.flashsale.real=true
quarkus.datasource.db-kind=postgresql
quarkus.datasource.active=${flashsale.real}
quarkus.datasource.devservices.enabled=false
quarkus.compose.devservices.enabled=false
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/checkout
quarkus.datasource.username=checkout
quarkus.datasource.password=checkout
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.acquisition-timeout=3S
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=flashsale
rabbitmq.password=flashsale
rabbitmq.virtual-host=/flashsale
quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.devservices.enabled=false
quarkus.redis.timeout=3S
checkout.events.transport=http
%test.checkout.events.transport=memory
quarkus.rest-client.processor.url=http://localhost:8081
quarkus.rest-client.processor.connect-timeout=1000
quarkus.rest-client.processor.read-timeout=3000

# Controles de demonstração exigem ativação explícita.
flashsale.demo.enabled=false
%mock.flashsale.real=false
