quarkus.http.port=8081
quarkus.http.host=0.0.0.0
# Todos os perfis de execução usam infraestrutura real.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.active=true
quarkus.datasource.devservices.enabled=false
quarkus.compose.devservices.enabled=false
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5434/processor
quarkus.datasource.username=processor
quarkus.datasource.password=processor
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.acquisition-timeout=3S
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=flashsale
rabbitmq.password=flashsale
rabbitmq.virtual-host=/flashsale
quarkus.http.test-port=8082
# Alias antigo aceito para compatibilidade de configuração.
processor.failure-mode=${processor.mock.failure-mode:never}

# Controles de demonstração exigem ativação explícita.
flashsale.demo.enabled=false
